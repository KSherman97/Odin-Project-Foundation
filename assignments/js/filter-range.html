  <script>
    /**
     * @author: Kyle Sherman
     * @date: 01/17/2026
     * @description:
     * Write a function filterRange(arr, a, b) that gets an array arr, 
     * looks for elements with values higher or 
     * equal to a and lower or equal to b and 
     * return a result as an array.
     * The function should not modify the array. 
     * It should return the new array.
    */
     function filterRange(arr, a, b) {
        const filteredArray = arr.filter((value) => {
            if(value >= a && value <= b) {
                return value;
            }
        });
        
        return filteredArray;
    }

    let arr = [5, 3, 8, 1];
    let filtered = filterRange(arr, 1, 4);
    alert(filtered); // 3, 1 (matching values)
    alert(arr); // unmodified values
